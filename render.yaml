services:
  - type: web
    name: virtual-poke-api
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: virtual-poke-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://your-vercel-app.vercel.app

databases:
  - name: virtual-poke-db
    databaseName: virtualpoke
    user: virtualpoke
